# ==============================================================================
# Standalone Forge App Compose: Telemetry Dashboard (Air-Gapped by Default)
# Invariant: internal: true -> ZERO outbound internet egress. Inbound via proxy.
# Usage: docker compose up --build -d
# ==============================================================================
name: forge-app-telemetry

networks:
  # 1. Isolated Application Network (Strict Air-Gap: No default gateway to internet)
  telemetry-airgap-net:
    driver: bridge
    internal: true

  # 2. Reverse-Proxy Gateway Mesh (Inbound routing from Caddy proxy only)
  forge-gateway-net:
    name: ${CONTAINER_PREFIX:-ag}_forge_apps_net
    external: true

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-app-telemetry-dev
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - NODE_ENV=development
    command: ["bun", "--watch", "src/server.ts"]
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      telemetry-airgap-net:
      forge-gateway-net:
        aliases:
          - app-telemetry
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
