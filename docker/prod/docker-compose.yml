# ==============================================================================
# AG Dashboard 2.0 - Production Docker Environment
# 100% Dynamically Driven by .env parameters (COMPOSE_PROJECT_NAME, CONTAINER_PREFIX, DOCKER_NETWORK)
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME:-ag_dashboard}-prod

networks:
  # 1. Host Ingress Network (Proxy & Host Gateway)
  ingress-net:
    name: ${CONTAINER_PREFIX:-ag}_ingress_net_prod
    driver: bridge

  # 2. Strict Air-Gapped Core Platform Network (internal: true -> ZERO outbound/egress)
  core-airgap-net:
    name: ${CONTAINER_PREFIX:-ag}_core_airgap_net_prod
    driver: bridge
    internal: true

  # 3. Forge Apps Network (Managed Egress / Autonomous Micro-Apps)
  forge-apps-net:
    name: ${CONTAINER_PREFIX:-ag}_forge_apps_net_prod
    driver: bridge

volumes:
  ag_caddy_data:
  ag_caddy_config:
  ag_prod_db_auth:
  ag_prod_db_portal:
  ag_prod_db_dev_dashboard:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 🔀 Unified Reverse Proxy Gateway
  proxy:
    image: caddy:2-alpine
    container_name: ${CONTAINER_PREFIX:-ag}-proxy-prod
    profiles: ["core", "apps", "monitoring", "all"]
    ports:
      - "${PROD_HTTP_PORT:-80}:${PROD_HTTP_PORT:-80}"
      - "${PROD_HTTPS_PORT:-443}:${PROD_HTTPS_PORT:-443}"
    volumes:
      - ../../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../proxy/errors:/etc/caddy/errors:ro
      - ../../proxy/certs:/etc/caddy/certs:ro
      - ../../public:/etc/caddy/public:ro
      - ag_caddy_data:/data
      - ag_caddy_config:/config
    networks:
      - ingress-net
      - core-airgap-net
      - forge-apps-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PROD_HTTP_PORT:-80}/ || wget --no-check-certificate --no-verbose --tries=1 --spider https://localhost:${PROD_HTTPS_PORT:-443}/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🌐 1. Platform Landing & Discovery Hub (Port 3000)
  landing:
    build:
      context: ../../
      dockerfile: apps/src/landing/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-landing-prod
    profiles: ["landing"]
    env_file:
      - ../../.env
    environment:
      - PORT=${LANDING_PORT:-3000}
      - LANDING_PORT=${LANDING_PORT:-3000}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    networks:
      - core-airgap-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🏢 2. Main Portal & Org Canvas (Port 3001)
  portal:
    build:
      context: ../../
      dockerfile: apps/src/portal/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-portal-prod
    profiles: ["core", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${PORTAL_PORT:-3001}
      - PORTAL_PORT=${PORTAL_PORT:-3001}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_portal:/app/data
    networks:
      - core-airgap-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 📊 3. Developer Monitoring Dashboard (Port 3002)
  dev-dashboard:
    build:
      context: ../../
      dockerfile: apps/src/dev-dashboard/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-dev-dashboard-prod
    profiles: ["monitoring", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${DEV_DASHBOARD_PORT:-3002}
      - DEV_DASHBOARD_PORT=${DEV_DASHBOARD_PORT:-3002}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_dev_dashboard:/app/data
    networks:
      - core-airgap-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 📚 4. Developer Hub & SDK Playground (Port 3003)
  dev-hub:
    build:
      context: ../../
      dockerfile: apps/src/dev-hub/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-dev-hub-prod
    profiles: ["monitoring", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${DEV_HUB_PORT:-3003}
      - DEV_HUB_PORT=${DEV_HUB_PORT:-3003}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    networks:
      - core-airgap-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🔐 5. Central Identity & Auth Service (Port 3004)
  auth:
    build:
      context: ../../
      dockerfile: apps/src/auth/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-auth-prod
    profiles: ["core", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${AUTH_PORT:-3004}
      - AUTH_PORT=${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_auth:/app/data
    networks:
      - core-airgap-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 📖 6. Living Documentation Core Service (Port 3005)
  docs:
    build:
      context: ../../
      dockerfile: apps/src/docs/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-docs-prod
    profiles: ["core", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${DOCS_PORT:-3005}
      - DOCS_PORT=${DOCS_PORT:-3005}
      - BASE_PATH=/docs
      - NODE_ENV=production
    networks:
      - core-airgap-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🩺 Automated Container Health Monitor (Autoheal Watchdog)
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ${CONTAINER_PREFIX:-ag}-autoheal-prod
    profiles: ["monitoring", "all"]
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - forge-apps-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # 🛡️ Continuous Database Backup Engine (Hourly Automatic Snapshots & Integrity Check)
  db-backup:
    image: oven/bun:1.3-alpine
    container_name: ${CONTAINER_PREFIX:-ag}-db-backup-prod
    profiles: ["monitoring", "all"]
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - DB_BACKUP_DIR=/app/backups/db
      - DB_BACKUP_INTERVAL_MINUTES=${DB_BACKUP_INTERVAL_MINUTES:-60}
      - DB_BACKUP_RETENTION_HOURS=${DB_BACKUP_RETENTION_HOURS:-168}
      - DB_BACKUP_ENCRYPT=${DB_BACKUP_ENCRYPT:-false}
      - DB_BACKUP_ENCRYPTION_KEY=${DB_BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - ../../apps/src/sdk:/app/apps/src/sdk:ro
      - ../../apps/src/types:/app/apps/src/types:ro
      - ../../apps/src/ui:/app/apps/src/ui:ro
      - ../../scripts:/app/scripts:ro
      - ../../backups:/app/backups:rw
      - ag_prod_db_auth:/app/data_sources/auth:ro
      - ag_prod_db_portal:/app/data_sources/portal:ro
      - ag_prod_db_dev_dashboard:/app/data_sources/dev_dashboard:ro
      - ag_prod_db_telemetry:/app/data_sources/telemetry:ro
    command: ["bun", "scripts/backup-databases.ts", "--daemon"]
    networks:
      - core-airgap-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -d /app/backups/db || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'


