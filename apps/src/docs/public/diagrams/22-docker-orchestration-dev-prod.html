<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SG Forge Docker Architecture - Dev Hot-Reload vs Prod AOT Compilation</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 960px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #4f46e5;
        --accent: #0891b2;
        --success: #059669;
        --warning: #d97706;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[fill="#1f2937"] { fill: #f1f5f9 !important; stroke: #cbd5e1; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#6EE7B7"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FDE68A"] { fill: #b45309 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg path[stroke="#4B5563"] { stroke: #94a3b8 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
        </marker>
        <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
        </marker>
      </defs>

      <!-- Main Header -->
      <text x="460" y="32" font-size="20" font-weight="700" fill="#F3F4F6" text-anchor="middle">SG FORGE DUAL-STACK DOCKER ARCHITECTURE</text>
      <text x="460" y="52" font-size="12" fill="#9CA3AF" text-anchor="middle">Development Hot-Reload (Inotify Watch) vs. Production AOT Compilation &amp; Code Obfuscation</text>

      <!-- LEFT COLUMN: DEVELOPMENT PIPELINE -->
      <rect x="30" y="80" width="410" height="430" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <rect x="30" y="80" width="410" height="42" rx="10" fill="#164E63" stroke="#06b6d4" stroke-width="1"/>
      <text x="50" y="106" font-size="14" font-weight="700" fill="#67E8F9">⚡ DEV STACK (docker/dev/docker-compose.yml)</text>
      <text x="390" y="106" font-size="11" font-weight="600" fill="#67E8F9" text-anchor="end">Sub-5ms Hot Reload</text>

      <!-- Host Source Bind -->
      <rect x="55" y="145" width="360" height="70" rx="8" fill="#1f2937" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="172" font-size="12" font-weight="700" fill="#F3F4F6">1. Host Filesystem Bind Mounts</text>
      <text x="75" y="192" font-size="11" fill="#9CA3AF">Mounts ./src, ./node_modules:ro, ./sdk, ./ui, package.json</text>
      <text x="75" y="206" font-size="10" fill="#67E8F9">Zero Build Lag • Direct Host Code Mirror</text>

      <!-- Down Arrow -->
      <path d="M 235 215 L 235 245" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

      <!-- Bun Inotify Engine -->
      <rect x="55" y="255" width="360" height="85" rx="8" fill="#164E63" stroke="#06b6d4" stroke-width="1"/>
      <text x="75" y="280" font-size="12" font-weight="700" fill="#67E8F9">2. Bun Watchdog Engine (bun --watch)</text>
      <text x="75" y="300" font-size="11" fill="#F3F4F6">Native Linux Inotify Kernel Event Listener</text>
      <text x="75" y="318" font-size="10" fill="#9CA3AF">Active on Core Services (:3000-:3005) &amp; Forge Apps (:8087-:8099)</text>
      <text x="75" y="332" font-size="10" fill="#A5B4FC">Instant sub-5ms in-memory delta re-evaluation</text>

      <!-- Down Arrow -->
      <path d="M 235 340 L 235 370" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

      <!-- Dev Ingress & Gateway -->
      <rect x="55" y="380" width="360" height="105" rx="8" fill="#1f2937" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="405" font-size="12" font-weight="700" fill="#F3F4F6">3. Local Reverse Proxy &amp; Probes</text>
      <text x="75" y="425" font-size="11" fill="#9CA3AF">• Caddy Gateway on :8080 / :8443 (HTTP/HTTPS)</text>
      <text x="75" y="443" font-size="11" fill="#9CA3AF">• Dynamic .env routing via @forge/sdk/registry</text>
      <text x="75" y="461" font-size="11" fill="#9CA3AF">• Dedicated ag_dev_db_* SQLite persistent volumes</text>
      <text x="75" y="477" font-size="10" fill="#34D399">Autoheal Watchdog Active (interval: 10s)</text>

      <!-- RIGHT COLUMN: PRODUCTION PIPELINE -->
      <rect x="480" y="80" width="410" height="430" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <rect x="480" y="80" width="410" height="42" rx="10" fill="#1E1B4B" stroke="#6366f1" stroke-width="1"/>
      <text x="500" y="106" font-size="14" font-weight="700" fill="#A5B4FC">🚀 PROD STACK (docker/prod/docker-compose.yml)</text>
      <text x="840" y="106" font-size="11" font-weight="600" fill="#A5B4FC" text-anchor="end">AOT Compiled &amp; Obfuscated</text>

      <!-- Stage 1: Builder -->
      <rect x="505" y="145" width="360" height="95" rx="8" fill="#1E1B4B" stroke="#6366f1" stroke-width="1"/>
      <text x="525" y="168" font-size="12" font-weight="700" fill="#A5B4FC">Stage 1: Multi-Stage Builder (oven/bun:alpine)</text>
      <text x="525" y="188" font-size="11" fill="#F3F4F6">bun build src/server.ts --target=bun --minify</text>
      <text x="525" y="206" font-size="10" fill="#9CA3AF">• Tree-shaking &amp; dead-code elimination (35+ files &rarr; 1)</text>
      <text x="525" y="222" font-size="10" fill="#67E8F9">• Identifier mangling, whitespace strip, zero sourcemap</text>
      <text x="525" y="235" font-size="10" fill="#A5B4FC">Output: /build/dist/server.js (100% Obfuscated)</text>

      <!-- Down Arrow -->
      <path d="M 685 240 L 685 270" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Artifact Transfer Wall -->
      <line x1="505" y1="280" x2="865" y2="280" stroke="#10b981" stroke-dasharray="4,4" stroke-width="1.5"/>
      <text x="685" y="295" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">HERMETIC ISOLATION WALL: ZERO .TS SOURCE CODE LEAKAGE</text>

      <!-- Down Arrow -->
      <path d="M 685 305 L 685 330" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Stage 2: Hardened Runner -->
      <rect x="505" y="340" width="360" height="145" rx="8" fill="#064E3B" stroke="#10b981" stroke-width="1"/>
      <text x="525" y="365" font-size="12" font-weight="700" fill="#6EE7B7">Stage 2: Minimal Hardened Runner (oven/bun:alpine)</text>
      <text x="525" y="385" font-size="11" fill="#F3F4F6">CMD ["bun", "dist/server.js"]</text>
      <text x="525" y="405" font-size="10" fill="#9CA3AF">• Zero source files, zero package manifests, zero node_modules</text>
      <text x="525" y="421" font-size="10" fill="#9CA3AF">• Strict non-root execution: USER bun (UID 1000)</text>
      <text x="525" y="437" font-size="10" fill="#9CA3AF">• Strict air-gap: core-airgap-net (internal: true)</text>
      <text x="525" y="453" font-size="10" fill="#9CA3AF">• Memory limits capped at 256M, CPU 1.0, restart: always</text>
      <text x="525" y="471" font-size="10" fill="#6EE7B7">Cold Boot: Instantaneous (Zero JIT Transpilation Latency)</text>
    </svg>
  </div>
</body>
</html>
