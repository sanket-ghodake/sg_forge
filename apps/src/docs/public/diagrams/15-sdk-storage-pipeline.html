<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foundation SDK Storage Pipeline &amp; Atomic Backups</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-15 desc-15">
      <title id="title-15">Foundation SDK Storage Pipeline &amp; Atomic Backups</title>
      <desc id="desc-15">Pipeline illustrating Turso database client factory, multi-tenant scoping, and atomic backup engine.</desc>

      <!-- Top Client Layer -->
      <rect x="240" y="15" width="320" height="42" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
      <text x="400" y="36" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="700">Microservice Runtime Request</text>
      <text x="400" y="49" text-anchor="middle" fill="#A5B4FC" font-size="10">Calls @forge/sdk (database.ts, backup.ts, logger.ts)</text>

      <!-- Arrow down -->
      <path d="M400 57 V85" stroke="#6366F1" stroke-width="2"/>
      <polygon points="396,85 404,85 400,92" fill="#6366F1"/>

      <!-- Step 1: Database Factory & Scoper -->
      <rect x="160" y="95" width="480" height="60" rx="8" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
      <text x="400" y="118" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="700">1. Turso (libSQL) SQLite Client Factory</text>
      <text x="400" y="134" text-anchor="middle" fill="#06B6D4" font-size="11">WAL Mode Enabled • Multi-Tenant org_id / user_id Parameterized Scoping</text>
      <text x="400" y="148" text-anchor="middle" fill="#9CA3AF" font-size="9.5">Automated Query Timing &amp; Slow-Query Warnings via createLogger</text>

      <!-- Two Paths: Live Queries vs. Backup Pipeline -->
      <path d="M280 155 V205" stroke="#10B981" stroke-width="2"/>
      <polygon points="276,205 284,205 280,212" fill="#10B981"/>

      <path d="M520 155 V205" stroke="#F59E0B" stroke-width="2"/>
      <polygon points="516,205 524,205 520,212" fill="#F59E0B"/>

      <!-- Column Left: Dedicated DB Isolation -->
      <rect x="60" y="215" width="310" height="150" rx="8" fill="rgba(16,185,129,0.06)" stroke="#10B981" stroke-width="1.5"/>
      <text x="215" y="238" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Dedicated SQLite Data Store</text>
      <line x1="80" y1="248" x2="350" y2="248" stroke="rgba(16,185,129,0.3)"/>
      <rect x="80" y="258" width="270" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="215" y="274" text-anchor="middle" fill="#F3F4F6" font-size="9.5">data/auth.db, portal.db, code.db</text>
      <rect x="80" y="288" width="270" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="215" y="304" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Zero Cross-App Database Access</text>
      <rect x="80" y="318" width="270" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="215" y="334" text-anchor="middle" fill="#F3F4F6" font-size="9.5">POSIX 0700 / 0600 Hardened Permissions</text>
      <text x="215" y="356" text-anchor="middle" fill="#9CA3AF" font-size="9">Air-Gapped Local Storage</text>

      <!-- Column Right: Atomic Backup & Recovery -->
      <rect x="430" y="215" width="310" height="150" rx="8" fill="rgba(245,158,11,0.06)" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="585" y="238" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="700">Atomic Backup &amp; Recovery Engine</text>
      <line x1="450" y1="248" x2="720" y2="248" stroke="rgba(245,158,11,0.3)"/>
      <rect x="450" y="258" width="270" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="585" y="274" text-anchor="middle" fill="#F3F4F6" font-size="9.5">scripts/backup-databases.ts</text>
      <rect x="450" y="288" width="270" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="585" y="304" text-anchor="middle" fill="#F3F4F6" font-size="9.5">SQLite VACUUM INTO Atomic Snapshot</text>
      <rect x="450" y="318" width="270" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="585" y="334" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Timestamped Tarball &amp; SHA-256 Checksum</text>
      <text x="585" y="356" text-anchor="middle" fill="#9CA3AF" font-size="9">Point-in-Time Zero-Loss Recovery</text>

      <!-- Bottom Invariant Summary -->
      <rect x="140" y="382" width="520" height="42" rx="6" fill="#111827" stroke="#6366F1" stroke-dasharray="4 4"/>
      <text x="400" y="401" text-anchor="middle" fill="#A5B4FC" font-size="11" font-weight="600">🛡️ Multi-Tenant Isolation • WAL Concurrency • Instant Crash Resilience</text>
      <text x="400" y="415" text-anchor="middle" fill="#9CA3AF" font-size="9.5">Every micro-app owns an isolated database • Never queries another app's tables</text>
    </svg>
  </div>
</body>
</html>
