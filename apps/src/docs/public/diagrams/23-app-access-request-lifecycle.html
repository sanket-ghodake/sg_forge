<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise App Access Request Lifecycle & Security Invariants</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 960px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.36); }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #4f46e5;
        --accent: #059669;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.08)"], svg line[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"], svg text[fill="#ffffff"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#451A03"] { fill: #fffbeb !important; stroke: #f59e0b !important; }
      svg rect[fill="#450A0A"] { fill: #fef2f2 !important; stroke: #ef4444 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#FBBF24"] { fill: #b45309 !important; }
      svg text[fill="#F87171"] { fill: #b91c1c !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 900 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-23 desc-23">
      <title id="title-23">Enterprise App Access Request Lifecycle & Security Invariants</title>
      <desc id="desc-23">Comprehensive sequence and state machine covering deduplication guard, real-time admin alert routing, cross-app isolation, live catalog activation, and employee offboarding.</desc>

      <!-- Diagram Header -->
      <rect x="20" y="20" width="860" height="50" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="450" y="44" text-anchor="middle" fill="#F3F4F6" font-size="14" font-weight="700">App Access Request Lifecycle &amp; Cross-App Governance (SG Forge Standard)</text>
      <text x="450" y="60" text-anchor="middle" fill="#9CA3AF" font-size="11">Deduplication Defense · Anti-Self-Approval · Dynamic Rerouting · Offboard Transition</text>

      <!-- Actors & Lanes Header -->
      <!-- Actor 1: Employee -->
      <rect x="50" y="90" width="160" height="40" rx="6" fill="#111827" stroke="#6366F1" stroke-width="1.2"/>
      <text x="130" y="115" text-anchor="middle" fill="#818CF8" font-size="12" font-weight="600">Employee (Requester)</text>

      <!-- Actor 2: Portal Gateway & Deduplication -->
      <rect x="260" y="90" width="180" height="40" rx="6" fill="#111827" stroke="#6366F1" stroke-width="1.2"/>
      <text x="350" y="115" text-anchor="middle" fill="#818CF8" font-size="12" font-weight="600">Portal API &amp; Guard</text>

      <!-- Actor 3: App Admin (Delegated) -->
      <rect x="490" y="90" width="170" height="40" rx="6" fill="#111827" stroke="#10B981" stroke-width="1.2"/>
      <text x="575" y="115" text-anchor="middle" fill="#34D399" font-size="12" font-weight="600">App Admin (Isolated)</text>

      <!-- Actor 4: Storage & Catalog Hydration -->
      <rect x="710" y="90" width="150" height="40" rx="6" fill="#111827" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="785" y="115" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="600">portal.db &amp; Catalog</text>

      <!-- Vertical Lifeline Dividers -->
      <line x1="130" y1="130" x2="130" y2="650" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="350" y1="130" x2="350" y2="650" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="575" y1="130" x2="575" y2="650" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="785" y1="130" x2="785" y2="650" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Step 1: Submit Request -->
      <line x1="130" y1="160" x2="350" y2="160" stroke="#6366F1" stroke-width="2"/>
      <polygon points="345,156 353,160 345,164" fill="#6366F1"/>
      <rect x="170" y="145" width="140" height="20" rx="4" fill="#111827"/>
      <text x="240" y="159" text-anchor="middle" fill="#F3F4F6" font-size="10" font-weight="500">1. POST /apps/requests</text>

      <!-- Step 2: Deduplication Verification Gate -->
      <rect x="270" y="180" width="160" height="50" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
      <text x="350" y="198" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="700">DEDUPLICATION GUARD</text>
      <text x="350" y="212" text-anchor="middle" fill="#F3F4F6" font-size="9">Check PENDING / APPROVED</text>
      <text x="350" y="224" text-anchor="middle" fill="#9CA3AF" font-size="8.5">Duplicate request? &rarr; 400 Bad Request</text>

      <!-- Step 3: Insert Pending & Alert Admins -->
      <line x1="350" y1="245" x2="785" y2="245" stroke="#F59E0B" stroke-width="1.5"/>
      <polygon points="780,241 788,245 780,249" fill="#F59E0B"/>
      <text x="567" y="240" text-anchor="middle" fill="#FBBF24" font-size="9.5">2. INSERT status='PENDING' (portal.db)</text>

      <line x1="350" y1="265" x2="575" y2="265" stroke="#10B981" stroke-width="1.5"/>
      <polygon points="570,261 578,265 570,269" fill="#10B981"/>
      <text x="462" y="260" text-anchor="middle" fill="#34D399" font-size="9.5">3. Real-Time Admin Notification</text>

      <!-- Step 4: Admin Turnover & Dynamic Scoping Callout -->
      <rect x="490" y="285" width="170" height="52" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
      <text x="575" y="302" text-anchor="middle" fill="#818CF8" font-size="9.5" font-weight="700">CROSS-APP ISOLATION</text>
      <text x="575" y="316" text-anchor="middle" fill="#F3F4F6" font-size="8.5">Only assigned apps visible</text>
      <text x="575" y="328" text-anchor="middle" fill="#9CA3AF" font-size="8.5">Dynamic turn-over rerouting</text>

      <!-- Step 5: Admin Decision & Anti-Self-Approval -->
      <line x1="575" y1="355" x2="350" y2="355" stroke="#10B981" stroke-width="2"/>
      <polygon points="355,351 347,355 355,359" fill="#10B981"/>
      <text x="462" y="348" text-anchor="middle" fill="#34D399" font-size="9.5">4. POST /apps/requests/decide</text>

      <!-- Anti-Self-Approval Guard Box -->
      <rect x="270" y="370" width="160" height="42" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
      <text x="350" y="386" text-anchor="middle" fill="#F87171" font-size="9.5" font-weight="700">ANTI-SELF-APPROVAL</text>
      <text x="350" y="401" text-anchor="middle" fill="#F3F4F6" font-size="8.5">adminUserId === req.userId &rarr; 400</text>

      <!-- Step 6: Decision Persistence & Inter-service Binding -->
      <line x1="350" y1="430" x2="785" y2="430" stroke="#10B981" stroke-width="1.5"/>
      <polygon points="780,426 788,430 780,434" fill="#10B981"/>
      <text x="567" y="424" text-anchor="middle" fill="#34D399" font-size="9.5">5. UPDATE status='APPROVED'</text>

      <!-- Step 7: Notification & Dynamic Catalog Hydration -->
      <line x1="350" y1="460" x2="130" y2="460" stroke="#6366F1" stroke-width="2"/>
      <polygon points="135,456 127,460 135,464" fill="#6366F1"/>
      <text x="240" y="454" text-anchor="middle" fill="#818CF8" font-size="9.5">6. Approved Event &amp; Notification</text>

      <!-- Dynamic Catalog Activation Box -->
      <rect x="40" y="480" width="180" height="60" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
      <text x="130" y="498" text-anchor="middle" fill="#34D399" font-size="10" font-weight="700">MY ACTIVE APPS HYDRATION</text>
      <text x="130" y="513" text-anchor="middle" fill="#F3F4F6" font-size="9">reconcileActiveAppsCatalog()</text>
      <text x="130" y="525" text-anchor="middle" fill="#9CA3AF" font-size="8.5">Auto-unlocks Launch button</text>
      <text x="130" y="536" text-anchor="middle" fill="#9CA3AF" font-size="8.5">Increments Active Apps counter</text>

      <!-- Offboarded Employee Invariant (Bottom Section) -->
      <rect x="40" y="560" width="820" height="75" rx="8" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <rect x="55" y="575" width="220" height="45" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
      <text x="165" y="594" text-anchor="middle" fill="#F87171" font-size="10" font-weight="700">EMPLOYEE OFFBOARDING</text>
      <text x="165" y="608" text-anchor="middle" fill="#F3F4F6" font-size="8.5">POST /employees/:id/offboard</text>

      <!-- Offboarding Transitions -->
      <path d="M 275 597 L 330 597" stroke="#EF4444" stroke-width="1.5"/>
      <polygon points="325,593 333,597 325,601" fill="#EF4444"/>

      <rect x="335" y="575" width="240" height="45" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
      <text x="455" y="593" text-anchor="middle" fill="#818CF8" font-size="9.5" font-weight="700">AUDIT TRAIL PRESERVED</text>
      <text x="455" y="607" text-anchor="middle" fill="#F3F4F6" font-size="8.5">PENDING &rarr; USER_INACTIVE</text>
      <text x="455" y="617" text-anchor="middle" fill="#9CA3AF" font-size="8">APPROVED &rarr; REVOKED_INACTIVE</text>

      <path d="M 575 597 L 625 597" stroke="#EF4444" stroke-width="1.5"/>
      <polygon points="620,593 628,597 620,601" fill="#EF4444"/>

      <rect x="630" y="575" width="215" height="45" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
      <text x="737" y="593" text-anchor="middle" fill="#FBBF24" font-size="9.5" font-weight="700">ADMIN ROLES PURGED</text>
      <text x="737" y="607" text-anchor="middle" fill="#F3F4F6" font-size="8.5">DELETE FROM portal_app_admins</text>
      <text x="737" y="617" text-anchor="middle" fill="#9CA3AF" font-size="8">Zero lingering privileges</text>
    </svg>
  </div>
</body>
</html>
