<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Hub &amp; SDK Playground Architecture</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --success: #10b981;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-13 desc-13">
      <title id="title-13">Developer Hub &amp; SDK Playground Architecture</title>
      <desc id="desc-13">Visual architecture of the Developer Hub serving interactive token minting, API simulation, and SDK reference.</desc>

      <!-- Ingress Header -->
      <rect x="250" y="15" width="300" height="42" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
      <text x="400" y="36" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="700">Developer Hub (:3003 /gateway)</text>
      <text x="400" y="49" text-anchor="middle" fill="#A5B4FC" font-size="10">Astryx Developer Gateway &amp; Sandbox</text>

      <!-- Connecting arrows -->
      <path d="M400 57 V85" stroke="#6366F1" stroke-width="2"/>
      <polygon points="396,85 404,85 400,92" fill="#6366F1"/>

      <!-- Central Controller -->
      <rect x="200" y="95" width="400" height="48" rx="6" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
      <text x="400" y="117" text-anchor="middle" fill="#F3F4F6" font-size="12" font-weight="600">Dev Hub Core Conductor &amp; Router</text>
      <text x="400" y="133" text-anchor="middle" fill="#9CA3AF" font-size="10">Dynamic Ingress Inspector • Health Prober • Token Engine</text>

      <!-- Fan out lines to 4 capability zones -->
      <path d="M280 143 L120 190" stroke="#06B6D4" stroke-width="1.5"/>
      <path d="M360 143 L300 190" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M440 143 L500 190" stroke="#10B981" stroke-width="1.5"/>
      <path d="M520 143 L680 190" stroke="#F59E0B" stroke-width="1.5"/>

      <!-- Zone 1: Token Minting Sandbox -->
      <rect x="30" y="195" width="175" height="155" rx="8" fill="rgba(6,182,212,0.06)" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="117" y="218" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">Token Mint Sandbox</text>
      <line x1="45" y1="228" x2="190" y2="228" stroke="rgba(6,182,212,0.3)"/>
      <rect x="45" y="238" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="117" y="254" text-anchor="middle" fill="#F3F4F6" font-size="9.5">1-Click Test Personas</text>
      <rect x="45" y="268" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="117" y="284" text-anchor="middle" fill="#F3F4F6" font-size="9.5">JWT Claims Inspector</text>
      <rect x="45" y="298" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="117" y="314" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Ed25519 JWKS Signing</text>
      <text x="117" y="338" text-anchor="middle" fill="#9CA3AF" font-size="8.5">Zero Central DB Hit</text>

      <!-- Zone 2: Health Mesh & Telemetry -->
      <rect x="215" y="195" width="175" height="155" rx="8" fill="rgba(99,102,241,0.06)" stroke="#6366F1" stroke-width="1.5"/>
      <text x="302" y="218" text-anchor="middle" fill="#818CF8" font-size="12" font-weight="700">Health Mesh Prober</text>
      <line x1="230" y1="228" x2="375" y2="228" stroke="rgba(99,102,241,0.3)"/>
      <rect x="230" y="238" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="302" y="254" text-anchor="middle" fill="#F3F4F6" font-size="9.5">1-Click Fleet Ping All</text>
      <rect x="230" y="268" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="302" y="284" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Dual-Probe Verification</text>
      <rect x="230" y="298" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="302" y="314" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Microsecond Latencies</text>
      <text x="302" y="338" text-anchor="middle" fill="#9CA3AF" font-size="8.5">8 Microservices Monitored</text>

      <!-- Zone 3: Scaffolding & Polyglot Engine -->
      <rect x="400" y="195" width="175" height="155" rx="8" fill="rgba(16,185,129,0.06)" stroke="#10B981" stroke-width="1.5"/>
      <text x="487" y="218" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Polyglot Scaffolder</text>
      <line x1="415" y1="228" x2="560" y2="228" stroke="rgba(16,185,129,0.3)"/>
      <rect x="415" y="238" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="487" y="254" text-anchor="middle" fill="#F3F4F6" font-size="9.5">TypeScript / Bun Starter</text>
      <rect x="415" y="268" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="487" y="284" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Python FastAPI Starter</text>
      <rect x="415" y="298" width="145" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="487" y="314" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Go Fiber Starter</text>
      <text x="487" y="338" text-anchor="middle" fill="#9CA3AF" font-size="8.5">Auto-Generates Scaffolding</text>

      <!-- Zone 4: SDK Simulator & RFC 7807 -->
      <rect x="585" y="195" width="185" height="155" rx="8" fill="rgba(245,158,11,0.06)" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="677" y="218" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="700">SDK Sandbox &amp; Errors</text>
      <line x1="600" y1="228" x2="755" y2="228" stroke="rgba(245,158,11,0.3)"/>
      <rect x="600" y="238" width="155" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="677" y="254" text-anchor="middle" fill="#F3F4F6" font-size="9.5">postMessage Bridge Sim</text>
      <rect x="600" y="268" width="155" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="677" y="284" text-anchor="middle" fill="#F3F4F6" font-size="9.5">RFC 7807 Problem Details</text>
      <rect x="600" y="298" width="155" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="677" y="314" text-anchor="middle" fill="#F3F4F6" font-size="9.5">Immutable Trace ID Log</text>
      <text x="677" y="338" text-anchor="middle" fill="#9CA3AF" font-size="8.5">Live Mock Environment</text>

      <!-- Footer Platform Standard -->
      <rect x="150" y="380" width="500" height="42" rx="6" fill="#111827" stroke="#6366F1" stroke-dasharray="4 4"/>
      <text x="400" y="400" text-anchor="middle" fill="#A5B4FC" font-size="11" font-weight="600">⚡ 100% Offline Air-Gapped Developer Experience</text>
      <text x="400" y="414" text-anchor="middle" fill="#9CA3AF" font-size="9.5">No External Cloud Dependencies • Native System Fonts • High-Precision Simulation</text>
    </svg>
  </div>
</body>
</html>
