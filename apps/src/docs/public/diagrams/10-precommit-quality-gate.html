<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pre-Commit Quality Gate 29-Check Pipeline</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-10 desc-10">
      <title id="title-10">Pre-Commit Verification Quality Gate Pipeline</title>
      <desc id="desc-10">Pipeline showing the stages of the 29 deterministic Tier 1 checks and 8 AI semantic audits running before code staging.</desc>
      
      <!-- Stage 1: Fast AST -->
      <rect x="50" y="40" width="160" height="90" rx="8" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="130" y="70" text-anchor="middle" fill="#818CF8" font-size="13" font-weight="700">STAGE 1: FAST AST</text>
      <text x="130" y="90" text-anchor="middle" fill="#F3F4F6" font-size="11">500-Line Cap • Secrets</text>
      <text x="130" y="110" text-anchor="middle" fill="#9CA3AF" font-size="10">Checks 01 - 05</text>
      
      <path d="M210 85 H240" stroke="#6366F1" stroke-width="2"/>
      
      <!-- Stage 2: Architecture -->
      <rect x="240" y="40" width="160" height="90" rx="8" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="320" y="70" text-anchor="middle" fill="#818CF8" font-size="13" font-weight="700">STAGE 2: BOUNDARIES</text>
      <text x="320" y="90" text-anchor="middle" fill="#F3F4F6" font-size="11">Aliases • Containers</text>
      <text x="320" y="110" text-anchor="middle" fill="#9CA3AF" font-size="10">Checks 06 - 11</text>
      
      <path d="M400 85 H430" stroke="#6366F1" stroke-width="2"/>
      
      <!-- Stage 3: Testing & Strictness -->
      <rect x="430" y="40" width="160" height="90" rx="8" fill="#111827" stroke="#06B6D4"/>
      <text x="510" y="70" text-anchor="middle" fill="#67E8F9" font-size="13" font-weight="700">STAGE 3: 5-TIER TESTS</text>
      <text x="510" y="90" text-anchor="middle" fill="#F3F4F6" font-size="11">511 Tests • 94% Types</text>
      <text x="510" y="110" text-anchor="middle" fill="#9CA3AF" font-size="10">Checks 12 - 18</text>
      
      <path d="M590 85 H620" stroke="#06B6D4" stroke-width="2"/>
      
      <!-- Stage 4: Traceability & Security -->
      <rect x="620" y="40" width="140" height="90" rx="8" fill="#064E3B" stroke="#10B981"/>
      <text x="690" y="70" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700">STAGE 4: PARITY</text>
      <text x="690" y="90" text-anchor="middle" fill="#F3F4F6" font-size="11">Standards • SBOM</text>
      <text x="690" y="110" text-anchor="middle" fill="#10B981" font-size="10">Checks 19 - 29</text>
      
      <!-- Tier 2 Semantic Audits -->
      <rect x="50" y="180" width="710" height="170" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="80" y="215" fill="#F3F4F6" font-size="14" font-weight="700">TIER 2: AI AGENT SEMANTIC AUDITS (8 INVARIANTS)</text>
      <text x="80" y="245" fill="#9CA3AF" font-size="12">1. Anti-Vibecoding &amp; Astryx Aesthetic Guard</text>
      <text x="80" y="270" fill="#9CA3AF" font-size="12">2. Correctness &amp; "No Guessing" Verification</text>
      <text x="80" y="295" fill="#9CA3AF" font-size="12">3. Multi-Tenant DB Org Isolation &amp; Zero Cross-Queries</text>
      <text x="80" y="320" fill="#10B981" font-size="12">4. In-Chat Strix Security &amp; Live Pentest Auditor</text>
      <text x="440" y="245" fill="#9CA3AF" font-size="12">5. Microservice Isolated Observability (logs/)</text>
      <text x="440" y="270" fill="#9CA3AF" font-size="12">6. Ignore, Attrib &amp; LF Line-Ending Hygiene</text>
      <text x="440" y="295" fill="#9CA3AF" font-size="12">7. Negative Assertions &amp; Replay Prevention</text>
      <text x="440" y="320" fill="#10B981" font-size="12">8. Absolute Zero Auto-Commits Enforced</text>
    </svg>
  </div>
</body>
</html>
