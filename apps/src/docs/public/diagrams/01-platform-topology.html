<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SG Forge Platform Topology & Ingress Gateway</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-01 desc-01">
      <title id="title-01">SG Forge Platform Topology & Gateway Ingress</title>
      <desc id="desc-01">Visual topology showing Caddy Gateway routing requests across core air-gapped services and autonomous Forge submodules.</desc>
      
      <!-- Client Layer -->
      <rect x="300" y="20" width="200" height="50" rx="8" fill="#111827" stroke="#6366F1" stroke-width="2"/>
      <text x="400" y="50" text-anchor="middle" fill="#F3F4F6" font-size="14" font-weight="600" font-family="sans-serif">User Browser / API Client</text>
      
      <!-- Arrow to Caddy -->
      <path d="M400 70 V120" stroke="#6366F1" stroke-width="2" stroke-dasharray="4 4"/>
      <polygon points="396,120 404,120 400,128" fill="#6366F1"/>
      
      <!-- Reverse Proxy Gateway -->
      <rect x="250" y="130" width="300" height="60" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="2"/>
      <text x="400" y="155" text-anchor="middle" fill="#F3F4F6" font-size="15" font-weight="700" font-family="sans-serif">Caddy Gateway (:80 / :443)</text>
      <text x="400" y="175" text-anchor="middle" fill="#9CA3AF" font-size="12" font-family="sans-serif">Dynamic Ingress Controller &amp; RFC 7807 Boundaries</text>
      
      <!-- Fan out arrows -->
      <path d="M300 190 L120 260" stroke="#06B6D4" stroke-width="1.5"/>
      <path d="M350 190 L260 260" stroke="#06B6D4" stroke-width="1.5"/>
      <path d="M400 190 L400 260" stroke="#06B6D4" stroke-width="1.5"/>
      <path d="M450 190 L540 260" stroke="#06B6D4" stroke-width="1.5"/>
      <path d="M500 190 L680 260" stroke="#06B6D4" stroke-width="1.5"/>
      
      <!-- Core Air-Gapped Services -->
      <rect x="40" y="260" width="140" height="70" rx="6" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="110" y="290" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600" font-family="sans-serif">Landing (:3000)</text>
      <text x="110" y="310" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="sans-serif">Public / Landing</text>
      
      <rect x="190" y="260" width="140" height="70" rx="6" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="260" y="290" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600" font-family="sans-serif">Portal (:3001)</text>
      <text x="260" y="310" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="sans-serif">Main SPA Canvas</text>
      
      <rect x="340" y="260" width="140" height="70" rx="6" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="410" y="290" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600" font-family="sans-serif">Central Auth (:3004)</text>
      <text x="410" y="310" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="sans-serif">Identity &amp; RBAC</text>
      
      <rect x="490" y="260" width="140" height="70" rx="6" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="560" y="290" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600" font-family="sans-serif">Docs Portal (:3005)</text>
      <text x="560" y="310" text-anchor="middle" fill="#9CA3AF" font-size="11" font-family="sans-serif">Living Eng Docs</text>
      
      <rect x="640" y="260" width="140" height="70" rx="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
      <text x="710" y="290" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600" font-family="sans-serif">Submodules</text>
      <text x="710" y="310" text-anchor="middle" fill="#10B981" font-size="11" font-family="sans-serif">Code &amp; Telemetry</text>
      
      <!-- Network Zone Legend -->
      <rect x="40" y="370" width="450" height="50" rx="6" fill="rgba(99,102,241,0.05)" stroke="#6366F1" stroke-dasharray="4 4"/>
      <text x="265" y="400" text-anchor="middle" fill="#818CF8" font-size="12" font-family="sans-serif">🔒 Core Air-Gap Network (core-airgap-net: internal: true)</text>
      
      <rect x="520" y="370" width="260" height="50" rx="6" fill="rgba(16,185,129,0.05)" stroke="#10B981" stroke-dasharray="4 4"/>
      <text x="650" y="400" text-anchor="middle" fill="#10B981" font-size="12" font-family="sans-serif">🌐 Forge Apps Net (forge-apps-net)</text>
    </svg>
  </div>
</body>
</html>
