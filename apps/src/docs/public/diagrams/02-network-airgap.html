<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air-Gap vs. Forge Apps Dual Network Security Architecture</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-02 desc-02">
      <title id="title-02">Dual Network Air-Gap Security Boundary</title>
      <desc id="desc-02">Architectural diagram detailing zero egress enforcement for core platform containers alongside autonomous submodule networking.</desc>
      
      <!-- Ingress Boundary -->
      <rect x="50" y="30" width="700" height="60" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="400" y="65" text-anchor="middle" fill="#F3F4F6" font-size="15" font-weight="700">INBOUND INGRESS GATEWAY (Caddy Port 80 / 443)</text>
      
      <!-- Left Zone: Core Air-Gap -->
      <rect x="50" y="120" width="400" height="260" rx="8" fill="rgba(99,102,241,0.04)" stroke="#6366F1" stroke-width="2"/>
      <text x="250" y="150" text-anchor="middle" fill="#818CF8" font-size="14" font-weight="700">ZONE A: CORE AIR-GAP NETWORK</text>
      <text x="250" y="170" text-anchor="middle" fill="#9CA3AF" font-size="11">Docker core-airgap-net (internal: true)</text>
      
      <rect x="80" y="195" width="150" height="60" rx="6" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="155" y="225" text-anchor="middle" fill="#F3F4F6" font-size="12" font-weight="600">Auth Engine</text>
      <text x="155" y="242" text-anchor="middle" fill="#9CA3AF" font-size="10">Port 3004</text>
      
      <rect x="260" y="195" width="150" height="60" rx="6" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="335" y="225" text-anchor="middle" fill="#F3F4F6" font-size="12" font-weight="600">Portal SPA</text>
      <text x="335" y="242" text-anchor="middle" fill="#9CA3AF" font-size="10">Port 3001</text>
      
      <rect x="80" y="275" width="330" height="80" rx="6" fill="rgba(239,68,68,0.08)" stroke="#EF4444" stroke-dasharray="4 4"/>
      <text x="245" y="305" text-anchor="middle" fill="#F87171" font-size="12" font-weight="700">🚫 ZERO OUTBOUND EGRESS</text>
      <text x="245" y="325" text-anchor="middle" fill="#9CA3AF" font-size="11">No internet routing • No telemetry phone-home</text>
      <text x="245" y="342" text-anchor="middle" fill="#9CA3AF" font-size="11">Guaranteed immunity to supply-chain exfiltration</text>
      
      <!-- Right Zone: Forge Apps Submodules -->
      <rect x="470" y="120" width="280" height="260" rx="8" fill="rgba(16,185,129,0.04)" stroke="#10B981" stroke-width="2"/>
      <text x="610" y="150" text-anchor="middle" fill="#34D399" font-size="14" font-weight="700">ZONE B: FORGE APPS NET</text>
      <text x="610" y="170" text-anchor="middle" fill="#9CA3AF" font-size="11">Docker forge-apps-net (Autonomous)</text>
      
      <rect x="500" y="195" width="220" height="60" rx="6" fill="#111827" stroke="#10B981"/>
      <text x="610" y="225" text-anchor="middle" fill="#F3F4F6" font-size="12" font-weight="600">Code Microservice</text>
      <text x="610" y="242" text-anchor="middle" fill="#9CA3AF" font-size="10">forge-apps/code (Port 8088)</text>
      
      <rect x="500" y="275" width="220" height="60" rx="6" fill="#111827" stroke="#10B981"/>
      <text x="610" y="305" text-anchor="middle" fill="#F3F4F6" font-size="12" font-weight="600">Telemetry Microservice</text>
      <text x="610" y="322" text-anchor="middle" fill="#9CA3AF" font-size="10">forge-apps/telemetry (Port 8087)</text>
    </svg>
  </div>
</body>
</html>
