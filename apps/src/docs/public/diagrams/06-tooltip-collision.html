<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewport Collision Detection &amp; Auto-Flip Algorithm</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-06 desc-06">
      <title id="title-06">Smart Viewport Collision Detection Algorithm</title>
      <desc id="desc-06">Algorithm flowchart illustrating how floating tooltips detect window edges and automatically flip upwards or clamp horizontally.</desc>
      
      <!-- Viewport Frame -->
      <rect x="50" y="30" width="700" height="360" rx="8" fill="#0B0F19" stroke="#6366F1" stroke-width="2"/>
      <text x="70" y="55" fill="#818CF8" font-size="12" font-weight="700">BROWSER VIEWPORT WINDOW (InnerWidth x InnerHeight)</text>
      
      <!-- Normal Placement -->
      <rect x="120" y="120" width="140" height="40" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="190" y="145" text-anchor="middle" fill="#F3F4F6" font-size="12">Trigger Element A</text>
      
      <rect x="110" y="180" width="160" height="50" rx="6" fill="#111827" stroke="#10B981"/>
      <text x="190" y="210" text-anchor="middle" fill="#10B981" font-size="11">Default Downward Tooltip</text>
      
      <path d="M190 160 V180" stroke="#10B981" stroke-width="1.5"/>
      
      <!-- Bottom Collision & Auto-Flip -->
      <rect x="480" y="280" width="140" height="40" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="550" y="305" text-anchor="middle" fill="#F3F4F6" font-size="12">Trigger Element B</text>
      
      <!-- Clipping Danger Area -->
      <rect x="470" y="335" width="160" height="50" rx="6" fill="rgba(239,68,68,0.1)" stroke="#EF4444" stroke-dasharray="4 4"/>
      <text x="550" y="365" text-anchor="middle" fill="#EF4444" font-size="11">Default position clipped! ✕</text>
      
      <!-- Auto-Flipped Upwards -->
      <rect x="470" y="215" width="160" height="50" rx="6" fill="#111827" stroke="#06B6D4" stroke-width="2"/>
      <text x="550" y="240" text-anchor="middle" fill="#67E8F9" font-size="11" font-weight="700">AUTO-FLIPPED UPWARDS ✓</text>
      <text x="550" y="255" text-anchor="middle" fill="#9CA3AF" font-size="10">y = rect.top - tipHeight - 8</text>
      
      <path d="M550 280 V265" stroke="#06B6D4" stroke-width="2"/>
      <polygon points="546,265 554,265 550,257" fill="#06B6D4"/>
    </svg>
  </div>
</body>
</html>
