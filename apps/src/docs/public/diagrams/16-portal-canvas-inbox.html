<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Canvas, Command Palette &amp; Inbox Architecture</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-16 desc-16">
      <title id="title-16">Portal Canvas, Command Palette &amp; Inbox Architecture</title>
      <desc id="desc-16">Visual architecture of the SG Forge Portal shell, command palette, interactive org canvas, and notification inbox.</desc>

      <!-- Portal Header Shell -->
      <rect x="20" y="15" width="760" height="42" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
      <circle cx="45" cy="36" r="10" fill="#6366F1"/>
      <text x="65" y="40" fill="#F3F4F6" font-size="13" font-weight="700">SG Forge Portal (:3001)</text>

      <!-- Command Palette Pill -->
      <rect x="250" y="24" width="240" height="24" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)"/>
      <text x="370" y="39" text-anchor="middle" fill="#9CA3AF" font-size="10">🔍 Search or jump to... (⌘K / Ctrl+K)</text>

      <!-- Right Header Controls -->
      <rect x="520" y="24" width="120" height="24" rx="4" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="580" y="39" text-anchor="middle" fill="#A5B4FC" font-size="9.5">Org: Acme Corp ▾</text>

      <circle cx="670" cy="36" r="12" fill="#111827" stroke="#F59E0B"/>
      <text x="670" y="40" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="700">🔔 3</text>

      <circle cx="715" cy="36" r="12" fill="#111827" stroke="#10B981"/>
      <text x="715" y="40" text-anchor="middle" fill="#34D399" font-size="9" font-weight="700">AR</text>

      <circle cx="755" cy="36" r="10" fill="#111827" stroke="rgba(255,255,255,0.2)"/>
      <text x="755" y="40" text-anchor="middle" fill="#F3F4F6" font-size="10">🌙</text>

      <!-- Left Sidebar (Collapsible Rail) -->
      <rect x="20" y="68" width="60" height="320" rx="6" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="50" y="100" text-anchor="middle" fill="#6366F1" font-size="14">🗺️</text>
      <text x="50" y="140" text-anchor="middle" fill="#9CA3AF" font-size="14">📦</text>
      <text x="50" y="180" text-anchor="middle" fill="#9CA3AF" font-size="14">📥</text>
      <text x="50" y="220" text-anchor="middle" fill="#9CA3AF" font-size="14">👥</text>
      <text x="50" y="260" text-anchor="middle" fill="#9CA3AF" font-size="14">⚙️</text>
      <text x="50" y="300" text-anchor="middle" fill="#9CA3AF" font-size="14">🛡️</text>
      <text x="50" y="360" text-anchor="middle" fill="#9CA3AF" font-size="11">56px</text>

      <!-- Main Workspace: Org Canvas View -->
      <rect x="90" y="68" width="460" height="320" rx="8" fill="rgba(99,102,241,0.03)" stroke="#6366F1" stroke-width="1.5"/>
      <text x="320" y="94" text-anchor="middle" fill="#818CF8" font-size="13" font-weight="700">2D Interactive Semantic Org Canvas</text>
      <text x="320" y="110" text-anchor="middle" fill="#9CA3AF" font-size="10">Zoomable Vector Grid • Materialized Paths • Dynamic Node Inspector</text>

      <!-- Canvas Nodes -->
      <rect x="230" y="130" width="180" height="42" rx="6" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
      <text x="320" y="150" text-anchor="middle" fill="#F3F4F6" font-size="11" font-weight="700">🏢 Acme HQ (Root Org)</text>
      <text x="320" y="163" text-anchor="middle" fill="#A5B4FC" font-size="9">Super Admin Alex Rivera</text>

      <!-- Tree Lines -->
      <path d="M320 172 V200" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M200 200 H440" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M200 200 V220" stroke="#6366F1" stroke-width="1.5"/>
      <path d="M440 200 V220" stroke="#6366F1" stroke-width="1.5"/>

      <!-- Child Node 1 -->
      <rect x="130" y="220" width="140" height="44" rx="6" fill="#111827" stroke="#06B6D4" stroke-width="1.2"/>
      <text x="200" y="240" text-anchor="middle" fill="#F3F4F6" font-size="10" font-weight="600">💻 Engineering</text>
      <text x="200" y="253" text-anchor="middle" fill="#38BDF8" font-size="8.5">4 Squads • 18 Members</text>

      <!-- Child Node 2 -->
      <rect x="370" y="220" width="140" height="44" rx="6" fill="#111827" stroke="#10B981" stroke-width="1.2"/>
      <text x="440" y="240" text-anchor="middle" fill="#F3F4F6" font-size="10" font-weight="600">📊 Operations</text>
      <text x="440" y="253" text-anchor="middle" fill="#34D399" font-size="8.5">2 Teams • 9 Members</text>

      <!-- Canvas Inspector Drawer Overlay -->
      <rect x="120" y="295" width="400" height="75" rx="6" fill="rgba(17,24,39,0.95)" stroke="rgba(255,255,255,0.1)"/>
      <text x="140" y="318" fill="#F3F4F6" font-size="10.5" font-weight="700">Inspector: Engineering Department</text>
      <text x="140" y="333" fill="#9CA3AF" font-size="9">Path: /org-1/dept-eng • Manager: Devon Hayes • IAM Role: roles/dev.operator</text>
      <text x="140" y="348" fill="#06B6D4" font-size="9">Assigned Apps: Cloud VS Code (:8088), Live Telemetry (:8087)</text>

      <!-- Right Drawer: Universal Inbox & Notifications -->
      <rect x="560" y="68" width="220" height="320" rx="8" fill="rgba(245,158,11,0.04)" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="670" y="94" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="700">Universal Inbox &amp; Alerts</text>
      <line x1="575" y1="104" x2="765" y2="104" stroke="rgba(245,158,11,0.3)"/>

      <!-- Notification Item 1 -->
      <rect x="575" y="115" width="190" height="52" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="585" y="132" fill="#F3F4F6" font-size="9.5" font-weight="600">🚀 New Submodule Deployed</text>
      <text x="585" y="146" fill="#9CA3AF" font-size="8.5">forge-apps/code updated</text>
      <text x="585" y="158" fill="#10B981" font-size="8">2m ago • Automated</text>

      <!-- Notification Item 2 -->
      <rect x="575" y="175" width="190" height="52" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="585" y="192" fill="#F3F4F6" font-size="9.5" font-weight="600">🛡️ Security Token Expiring</text>
      <text x="585" y="206" fill="#9CA3AF" font-size="8.5">Sliding window in 5 mins</text>
      <text x="585" y="218" fill="#F59E0B" font-size="8">12m ago • Auth Engine</text>

      <!-- Notification Item 3 -->
      <rect x="575" y="235" width="190" height="52" rx="4" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
      <text x="585" y="252" fill="#F3F4F6" font-size="9.5" font-weight="600">📋 Database Snapshot Done</text>
      <text x="585" y="266" fill="#9CA3AF" font-size="8.5">data/backup-20260907.tar</text>
      <text x="585" y="278" fill="#6366F1" font-size="8">35m ago • Backup SDK</text>

      <!-- Bottom Platform Bar -->
      <rect x="80" y="400" width="640" height="36" rx="6" fill="#111827" stroke="#6366F1" stroke-dasharray="4 4"/>
      <text x="400" y="422" text-anchor="middle" fill="#A5B4FC" font-size="10.5" font-weight="600">Zero Hard Refreshes • Sub-16ms View Switching • 320px Fluid Mobile Responsiveness</text>
    </svg>
  </div>
</body>
</html>
