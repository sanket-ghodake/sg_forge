<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Single Page Application (SPA) Routing</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-08 desc-08">
      <title id="title-08">Portal Single Page Application Routing Architecture</title>
      <desc id="desc-08">Wireframe illustrating client-side dynamic view hydration, history state manipulation, and instant tab transitions.</desc>
      
      <!-- App Shell Window -->
      <rect x="50" y="30" width="700" height="340" rx="8" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
      <rect x="50" y="30" width="700" height="40" rx="8" fill="#1E1B4B"/>
      <circle cx="75" cy="50" r="5" fill="#EF4444"/>
      <circle cx="95" cy="50" r="5" fill="#F59E0B"/>
      <circle cx="115" cy="50" r="5" fill="#10B981"/>
      <text x="400" y="55" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600">SG Forge Portal Canvas (SPA Mode Active)</text>
      
      <!-- Sidebar -->
      <rect x="50" y="70" width="180" height="300" fill="#0B0F19" stroke="rgba(255,255,255,0.08)"/>
      <rect x="65" y="90" width="150" height="35" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="80" y="112" fill="#F3F4F6" font-size="12" font-weight="600">● Workspace</text>
      
      <rect x="65" y="135" width="150" height="35" rx="6" fill="transparent"/>
      <text x="80" y="157" fill="#9CA3AF" font-size="12">○ Code App</text>
      
      <rect x="65" y="180" width="150" height="35" rx="6" fill="transparent"/>
      <text x="80" y="202" fill="#9CA3AF" font-size="12">○ Telemetry</text>
      
      <!-- Main Content Viewport -->
      <rect x="250" y="90" width="480" height="260" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
      <text x="270" y="120" fill="#818CF8" font-size="14" font-weight="700">Instantaneous DOM Hydration (Zero Hard Reloads)</text>
      <text x="270" y="145" fill="#9CA3AF" font-size="12">1. User clicks sidebar nav item</text>
      <text x="270" y="170" fill="#9CA3AF" font-size="12">2. history.pushState updates browser URL immediately</text>
      <text x="270" y="195" fill="#9CA3AF" font-size="12">3. Client view conductor hydrates matching view container</text>
      <text x="270" y="220" fill="#10B981" font-size="12">4. State preserved: active filters, scroll positions, form drafts</text>
      
      <rect x="270" y="250" width="440" height="70" rx="6" fill="#064E3B" stroke="#10B981"/>
      <text x="490" y="280" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700">⚡ Fluid &amp; Responsive down to 320px Viewport</text>
      <text x="490" y="302" text-anchor="middle" fill="#F3F4F6" font-size="11">Zero horizontal scroll • Touch-friendly touch targets</text>
    </svg>
  </div>
</body>
</html>
