<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dedicated Turso libSQL Database Isolation</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-03 desc-03">
      <title id="title-03">Dedicated Turso libSQL Multi-Tenant Database Isolation</title>
      <desc id="desc-03">Diagram demonstrating physical file-level database isolation per micro-app and tenant org_id scoping.</desc>
      
      <!-- Apps Layer -->
      <rect x="60" y="40" width="180" height="70" rx="8" fill="#111827" stroke="#6366F1" stroke-width="1.5"/>
      <text x="150" y="72" text-anchor="middle" fill="#F3F4F6" font-size="14" font-weight="600">Platform Core</text>
      <text x="150" y="92" text-anchor="middle" fill="#9CA3AF" font-size="11">apps/src/portal</text>
      
      <rect x="310" y="40" width="180" height="70" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
      <text x="400" y="72" text-anchor="middle" fill="#F3F4F6" font-size="14" font-weight="600">Forge Code App</text>
      <text x="400" y="92" text-anchor="middle" fill="#9CA3AF" font-size="11">forge-apps/code</text>
      
      <rect x="560" y="40" width="180" height="70" rx="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="650" y="72" text-anchor="middle" fill="#F3F4F6" font-size="14" font-weight="600">Forge Telemetry</text>
      <text x="650" y="92" text-anchor="middle" fill="#9CA3AF" font-size="11">forge-apps/telemetry</text>
      
      <!-- Direct connection arrows -->
      <path d="M150 110 V190" stroke="#6366F1" stroke-width="2"/>
      <path d="M400 110 V190" stroke="#10B981" stroke-width="2"/>
      <path d="M650 110 V190" stroke="#06B6D4" stroke-width="2"/>
      
      <!-- Prohibited Cross Queries -->
      <path d="M170 110 L380 190" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="275" cy="150" r="10" fill="#EF4444"/>
      <text x="275" y="154" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">✕</text>
      
      <path d="M420 110 L630 190" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="525" cy="150" r="10" fill="#EF4444"/>
      <text x="525" y="154" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">✕</text>
      
      <!-- Dedicated Databases -->
      <rect x="60" y="200" width="180" height="150" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="150" y="235" text-anchor="middle" fill="#818CF8" font-size="14" font-weight="700">platform_core.db</text>
      <text x="150" y="260" text-anchor="middle" fill="#F3F4F6" font-size="12">apps/data/</text>
      <line x1="80" y1="280" x2="220" y2="280" stroke="rgba(255,255,255,0.1)"/>
      <text x="150" y="305" text-anchor="middle" fill="#9CA3AF" font-size="11">WHERE org_id = ?</text>
      <text x="150" y="325" text-anchor="middle" fill="#10B981" font-size="11">WAL Mode Active</text>
      
      <rect x="310" y="200" width="180" height="150" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
      <text x="400" y="235" text-anchor="middle" fill="#34D399" font-size="14" font-weight="700">code.db</text>
      <text x="400" y="260" text-anchor="middle" fill="#F3F4F6" font-size="12">forge-apps/code/data/</text>
      <line x1="330" y1="280" x2="470" y2="280" stroke="rgba(255,255,255,0.1)"/>
      <text x="400" y="305" text-anchor="middle" fill="#9CA3AF" font-size="11">WHERE org_id = ?</text>
      <text x="400" y="325" text-anchor="middle" fill="#10B981" font-size="11">Local Isolation</text>
      
      <rect x="560" y="200" width="180" height="150" rx="8" fill="#164E63" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="650" y="235" text-anchor="middle" fill="#67E8F9" font-size="14" font-weight="700">telemetry.db</text>
      <text x="650" y="260" text-anchor="middle" fill="#F3F4F6" font-size="12">forge-apps/telemetry/data/</text>
      <line x1="580" y1="280" x2="720" y2="280" stroke="rgba(255,255,255,0.1)"/>
      <text x="650" y="305" text-anchor="middle" fill="#9CA3AF" font-size="11">Rolling 5MB Buffer</text>
      <text x="650" y="325" text-anchor="middle" fill="#10B981" font-size="11">Automatic Pruning</text>
    </svg>
  </div>
</body>
</html>
