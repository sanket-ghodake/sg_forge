<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise User Journey & Org Canvas Navigation</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End-to-End Enterprise User Journey">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
        </marker>
        <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect x="0" y="0" width="860" height="480" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)"/>

      <!-- Header Title -->
      <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F3F4F6">End-to-End Enterprise User Journey & Org Workspace</text>
      <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9CA3AF">Zero-Trust Authentication ➔ SPA Hydration ➔ Org Switching ➔ Sandboxed Micro-Apps</text>

      <!-- Step 1: User Login -->
      <g transform="translate(32, 95)">
        <rect width="180" height="220" rx="8" fill="#1E1B4B" stroke="#6366f1" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="14" fill="#312E81"/>
        <text x="24" y="33" font-family="monospace" font-size="12" font-weight="bold" fill="#818CF8">1</text>
        <text x="50" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Identity Auth</text>
        <text x="50" y="40" font-family="sans-serif" font-size="10" fill="#9CA3AF">GET /auth</text>

        <rect x="12" y="58" width="156" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Argon2id + Salt</text>
        <text x="20" y="92" font-family="sans-serif" font-size="10" fill="#9CA3AF">Zero plain-text secrets</text>

        <rect x="12" y="112" width="156" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="130" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Sliding JWT Cookie</text>
        <text x="20" y="146" font-family="sans-serif" font-size="10" fill="#9CA3AF">HttpOnly, SameSite=Lax</text>

        <rect x="12" y="166" width="156" height="42" rx="4" fill="#312E81" stroke="#818cf8"/>
        <text x="20" y="186" font-family="monospace" font-size="10" fill="#818CF8">30-min idle timeout</text>
        <text x="20" y="200" font-family="sans-serif" font-size="9" fill="#9CA3AF">Auto-revocation on replay</text>
      </g>

      <!-- Arrow 1 to 2 -->
      <line x1="214" y1="205" x2="238" y2="205" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2: Portal Hydration -->
      <g transform="translate(244, 95)">
        <rect width="180" height="220" rx="8" fill="#064E3B" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="14" fill="#065F46"/>
        <text x="24" y="33" font-family="monospace" font-size="12" font-weight="bold" fill="#34D399">2</text>
        <text x="50" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Portal SPA</text>
        <text x="50" y="40" font-family="sans-serif" font-size="10" fill="#9CA3AF">GET /portal</text>

        <rect x="12" y="58" width="156" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Zero-FOUC Shield</text>
        <text x="20" y="92" font-family="sans-serif" font-size="10" fill="#9CA3AF">Inline head script</text>

        <rect x="12" y="112" width="156" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="130" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Client View Router</text>
        <text x="20" y="146" font-family="sans-serif" font-size="10" fill="#9CA3AF">Zero full-page reloads</text>

        <rect x="12" y="166" width="156" height="42" rx="4" fill="#065F46" stroke="#10b981"/>
        <text x="20" y="186" font-family="monospace" font-size="10" fill="#34D399">Org Canvas Hydrated</text>
        <text x="20" y="200" font-family="sans-serif" font-size="9" fill="#9CA3AF">Bento widgets active</text>
      </g>

      <!-- Arrow 2 to 3 -->
      <line x1="426" y1="205" x2="450" y2="205" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 3: Multi-Tenant Switcher -->
      <g transform="translate(456, 95)">
        <rect width="180" height="220" rx="8" fill="#164E63" stroke="#06b6d4" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="14" fill="#155E75"/>
        <text x="24" y="33" font-family="monospace" font-size="12" font-weight="bold" fill="#67E8F9">3</text>
        <text x="50" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Tenant Switch</text>
        <text x="50" y="40" font-family="sans-serif" font-size="10" fill="#9CA3AF">Org Scoping</text>

        <rect x="12" y="58" width="156" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Org ID Context</text>
        <text x="20" y="92" font-family="sans-serif" font-size="10" fill="#9CA3AF">org_acme_corp</text>

        <rect x="12" y="112" width="156" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="130" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Broadcast Channel</text>
        <text x="20" y="146" font-family="sans-serif" font-size="10" fill="#9CA3AF">Sync across browser tabs</text>

        <rect x="12" y="166" width="156" height="42" rx="4" fill="#155E75" stroke="#06b6d4"/>
        <text x="20" y="186" font-family="monospace" font-size="10" fill="#67E8F9">Turso Scoped DB</text>
        <text x="20" y="200" font-family="sans-serif" font-size="9" fill="#9CA3AF">Isolated queries</text>
      </g>

      <!-- Arrow 3 to 4 -->
      <line x1="638" y1="205" x2="662" y2="205" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 4: Micro-App Launch -->
      <g transform="translate(668, 95)">
        <rect width="160" height="220" rx="8" fill="#312E81" stroke="#818cf8" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="14" fill="#3730A3"/>
        <text x="24" y="33" font-family="monospace" font-size="12" font-weight="bold" fill="#A5B4FC">4</text>
        <text x="50" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Micro-Apps</text>
        <text x="50" y="40" font-family="sans-serif" font-size="10" fill="#9CA3AF">Sandboxed</text>

        <rect x="10" y="58" width="140" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="16" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Code Service</text>
        <text x="16" y="92" font-family="sans-serif" font-size="10" fill="#9CA3AF">/apps/code</text>

        <rect x="10" y="112" width="140" height="46" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="16" y="130" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Telemetry App</text>
        <text x="16" y="146" font-family="sans-serif" font-size="10" fill="#9CA3AF">/apps/telemetry</text>

        <rect x="10" y="166" width="140" height="42" rx="4" fill="#3730A3" stroke="#818cf8"/>
        <text x="16" y="186" font-family="monospace" font-size="10" fill="#A5B4FC">Iframe Handshake</text>
        <text x="16" y="200" font-family="sans-serif" font-size="9" fill="#9CA3AF">Safe postMessage bridge</text>
      </g>

      <!-- Bottom Integration Summary Bar -->
      <g transform="translate(32, 335)">
        <rect width="796" height="110" rx="8" fill="rgba(17,24,39,0.95)" stroke="#10b981" stroke-width="1.5"/>
        <text x="24" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">Universal Workspace Guarantee (Desktop down to 320px Mobile)</text>
        <text x="24" y="52" font-family="sans-serif" font-size="11" fill="#9CA3AF">Zero page refreshes, instant offline fallback shield, automated theme synchronization, and 100% viewport collision containment.</text>
        
        <rect x="24" y="66" width="230" height="30" rx="4" fill="#1E1B4B" stroke="#6366f1" stroke-width="1"/>
        <text x="36" y="86" font-family="monospace" font-size="11" fill="#818CF8">📱 Fluid 320px Responsive</text>

        <rect x="270" y="66" width="240" height="30" rx="4" fill="#064E3B" stroke="#10b981" stroke-width="1"/>
        <text x="282" y="86" font-family="monospace" font-size="11" fill="#34D399">🎨 Astryx Design Tokens</text>

        <rect x="526" y="66" width="270" height="30" rx="4" fill="#164E63" stroke="#06b6d4" stroke-width="1"/>
        <text x="538" y="86" font-family="monospace" font-size="11" fill="#67E8F9">⚡ Zero FOUC Dynamic Themes</text>
      </g>
    </svg>
  </div>
</body>
</html>
