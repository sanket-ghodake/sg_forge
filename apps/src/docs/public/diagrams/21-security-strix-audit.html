<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In-Chat AI Security Auditor & Pentest Architecture</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="In-Chat AI Security Auditor and Pentest Architecture">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
        </marker>
        <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect x="0" y="0" width="860" height="480" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)"/>

      <!-- Header Title -->
      <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F3F4F6">In-Chat AI Security Auditor (Strix Standard)</text>
      <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9CA3AF">Zero-API Key Operation ➔ Mode 1: Static AST Code Check ⟷ Mode 2: Dynamic Live Pentest</text>

      <!-- Mode 1: White-Box Static AST Check -->
      <g transform="translate(32, 95)">
        <rect width="380" height="220" rx="8" fill="#1E1B4B" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="16" y="14" width="32" height="28" rx="6" fill="#312E81"/>
        <text x="23" y="33" font-family="monospace" font-size="12" font-weight="bold" fill="#818CF8">M1</text>
        <text x="56" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">Mode 1: White-Box Code Audit</text>
        <text x="56" y="40" font-family="sans-serif" font-size="11" fill="#9CA3AF">Trigger: strix-code-audit / audit code</text>

        <rect x="16" y="58" width="348" height="44" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="28" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Multi-Tenant Scoping Audit</text>
        <text x="28" y="92" font-family="sans-serif" font-size="10" fill="#9CA3AF">Checks org_id filtering across Turso libSQL queries</text>

        <rect x="16" y="110" width="348" height="44" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="28" y="128" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Zero Secret Leaks & PII Scrubbing</text>
        <text x="28" y="144" font-family="sans-serif" font-size="10" fill="#9CA3AF">AST regex checks for API keys, tokens, credentials</text>

        <rect x="16" y="162" width="348" height="44" rx="4" fill="#312E81" stroke="#818cf8"/>
        <text x="28" y="180" font-family="monospace" font-size="11" fill="#818CF8">RFC 7807 Error Boundaries</text>
        <text x="28" y="196" font-family="sans-serif" font-size="10" fill="#9CA3AF">Confirms traceId tagging and zero stack leaks</text>
      </g>

      <!-- Mode 2: Dynamic Live Pentest -->
      <g transform="translate(448, 95)">
        <rect width="380" height="220" rx="8" fill="#064E3B" stroke="#10b981" stroke-width="1.5"/>
        <rect x="16" y="14" width="32" height="28" rx="6" fill="#065F46"/>
        <text x="23" y="33" font-family="monospace" font-size="12" font-weight="bold" fill="#34D399">M2</text>
        <text x="56" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">Mode 2: Dynamic Live Pentest</text>
        <text x="56" y="40" font-family="sans-serif" font-size="11" fill="#9CA3AF">Trigger: strix-live-pentest / test live dev</text>

        <rect x="16" y="58" width="348" height="44" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="28" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">HTTP Security Headers Probe</text>
        <text x="28" y="92" font-family="monospace" font-size="10" fill="#34D399">rtk curl -sI (HSTS, CSP, X-Frame-Options)</text>

        <rect x="16" y="110" width="348" height="44" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="28" y="128" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Cookie Attribute Verification</text>
        <text x="28" y="144" font-family="sans-serif" font-size="10" fill="#9CA3AF">Confirms HttpOnly, SameSite=Lax, Secure flags</text>

        <rect x="16" y="162" width="348" height="44" rx="4" fill="#065F46" stroke="#10b981"/>
        <text x="28" y="180" font-family="monospace" font-size="11" fill="#34D399">CORS & Auth Redirect Checks</text>
        <text x="28" y="196" font-family="sans-serif" font-size="10" fill="#9CA3AF">Verifies unauthorized 401/302 redirects</text>
      </g>

      <!-- Bottom Invariant Ledger Box -->
      <g transform="translate(32, 335)">
        <rect width="796" height="110" rx="8" fill="rgba(17,24,39,0.95)" stroke="#6366f1" stroke-width="1.5"/>
        <text x="24" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">Zero-Cost & In-Session Execution Guarantee</text>
        <text x="24" y="52" font-family="sans-serif" font-size="11" fill="#9CA3AF">Operates 100% locally inside the AI assistant chat context without requiring external SaaS API keys or cloud tokens.</text>
        
        <rect x="24" y="66" width="240" height="30" rx="4" fill="#1E1B4B" stroke="#6366f1" stroke-width="1"/>
        <text x="36" y="86" font-family="monospace" font-size="11" fill="#818CF8">🛡️ Zero External SaaS Calls</text>

        <rect x="280" y="66" width="230" height="30" rx="4" fill="#064E3B" stroke="#10b981" stroke-width="1"/>
        <text x="292" y="86" font-family="monospace" font-size="11" fill="#34D399">⚡ Non-Destructive Probing</text>

        <rect x="526" y="66" width="270" height="30" rx="4" fill="#164E63" stroke="#06b6d4" stroke-width="1"/>
        <text x="538" y="86" font-family="monospace" font-size="11" fill="#67E8F9">🔒 Pre-Commit Staging Audit</text>
      </g>
    </svg>
  </div>
</body>
</html>
