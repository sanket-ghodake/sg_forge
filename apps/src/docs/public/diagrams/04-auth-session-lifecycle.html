<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HMAC-SHA256 Sliding Inactivity Session Lifecycle</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-04 desc-04">
      <title id="title-04">HMAC-SHA256 Sliding Inactivity Session Flow</title>
      <desc id="desc-04">Sequence diagram illustrating token issuance, constant-time validation, sliding window renewal, and inactivity timeout revocation.</desc>
      
      <!-- Lifelines -->
      <rect x="80" y="30" width="140" height="40" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="150" y="55" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600">Client Browser</text>
      <line x1="150" y1="70" x2="150" y2="390" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4"/>
      
      <rect x="330" y="30" width="140" height="40" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="400" y="55" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600">Auth Middleware</text>
      <line x1="400" y1="70" x2="400" y2="390" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4"/>
      
      <rect x="580" y="30" width="140" height="40" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="650" y="55" text-anchor="middle" fill="#F3F4F6" font-size="13" font-weight="600">Upstream Service</text>
      <line x1="650" y1="70" x2="650" y2="390" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4"/>
      
      <!-- Step 1: Initial Request -->
      <path d="M150 110 H400" stroke="#6366F1" stroke-width="1.5"/>
      <polygon points="395,106 403,110 395,114" fill="#6366F1"/>
      <text x="275" y="100" text-anchor="middle" fill="#F3F4F6" font-size="11">1. GET /portal (with __session cookie)</text>
      
      <!-- Step 2: Constant-Time Verify -->
      <rect x="340" y="130" width="120" height="40" rx="4" fill="#111827" stroke="#06B6D4"/>
      <text x="400" y="155" text-anchor="middle" fill="#06B6D4" font-size="10">Verify HMAC Signature</text>
      
      <!-- Step 3: Upstream Call -->
      <path d="M400 190 H650" stroke="#10B981" stroke-width="1.5"/>
      <polygon points="645,186 653,190 645,194" fill="#10B981"/>
      <text x="525" y="180" text-anchor="middle" fill="#10B981" font-size="11">2. Inject X-Tenant-Org: org_123</text>
      
      <!-- Step 4: Sliding Refresh -->
      <path d="M400 240 H150" stroke="#818CF8" stroke-width="1.5"/>
      <polygon points="155,236 147,240 155,244" fill="#818CF8"/>
      <text x="275" y="230" text-anchor="middle" fill="#818CF8" font-size="11">3. Set-Cookie: renewed sliding expiry</text>
      
      <!-- Inactivity Timeout Zone -->
      <rect x="100" y="280" width="600" height="90" rx="6" fill="rgba(239,68,68,0.06)" stroke="#EF4444" stroke-dasharray="4 4"/>
      <text x="400" y="310" text-anchor="middle" fill="#F87171" font-size="12" font-weight="700">INACTIVITY TIMEOUT (&gt; 15 mins inactivity)</text>
      <text x="400" y="330" text-anchor="middle" fill="#9CA3AF" font-size="11">Subsequent request rejected with HTTP 401 Unauthorized</text>
      <text x="400" y="350" text-anchor="middle" fill="#EF4444" font-size="11">RFC 7807 Problem Response: "urn:sgforge:error:session-expired"</text>
    </svg>
  </div>
</body>
</html>
