<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4-Pillar Observability & Telemetry Pipeline</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --accent: #06b6d4;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg-root);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4-Pillar Observability and Telemetry Pipeline">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect x="0" y="0" width="860" height="480" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)"/>

      <!-- Header Title -->
      <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F3F4F6">4-Pillar Observability & Telemetry Pipeline</text>
      <text x="32" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9CA3AF">Structured JSON Telemetry, Dual Probes, Browser Bridge & RFC 7807 Boundaries</text>

      <!-- Pillar 1: Dual Probes -->
      <g transform="translate(32, 90)">
        <rect width="180" height="190" rx="8" fill="#1E1B4B" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="12" y="14" width="28" height="28" rx="6" fill="#312E81"/>
        <text x="21" y="33" font-family="monospace" font-size="14" font-weight="bold" fill="#818CF8">01</text>
        <text x="50" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Dual Probes</text>
        <text x="50" y="42" font-family="sans-serif" font-size="10" fill="#9CA3AF">Health & Ready</text>
        
        <rect x="12" y="58" width="156" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="76" font-family="monospace" font-size="11" font-weight="bold" fill="#34D399">GET /health</text>
        <text x="20" y="94" font-family="sans-serif" font-size="10" fill="#9CA3AF">Liveness & Socket Active</text>

        <rect x="12" y="120" width="156" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="138" font-family="monospace" font-size="11" font-weight="bold" fill="#67E8F9">GET /ready</text>
        <text x="20" y="156" font-family="sans-serif" font-size="10" fill="#9CA3AF">DB, Disk & Upstream Ready</text>
      </g>

      <!-- Pillar 2: Browser Console Bridge -->
      <g transform="translate(232, 90)">
        <rect width="180" height="190" rx="8" fill="#064E3B" stroke="#10b981" stroke-width="1.5"/>
        <rect x="12" y="14" width="28" height="28" rx="6" fill="#065F46"/>
        <text x="21" y="33" font-family="monospace" font-size="14" font-weight="bold" fill="#34D399">02</text>
        <text x="50" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Browser Bridge</text>
        <text x="50" y="42" font-family="sans-serif" font-size="10" fill="#9CA3AF">Console Telemetry</text>

        <rect x="12" y="58" width="156" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">PII Redaction</text>
        <text x="20" y="94" font-family="sans-serif" font-size="10" fill="#9CA3AF">Tokens & Secrets Masked</text>

        <rect x="12" y="120" width="156" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="138" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Console Stream</text>
        <text x="20" y="156" font-family="sans-serif" font-size="10" fill="#9CA3AF">Structured window events</text>
      </g>

      <!-- Pillar 3: Container JSON Logs -->
      <g transform="translate(432, 90)">
        <rect width="180" height="190" rx="8" fill="#164E63" stroke="#06b6d4" stroke-width="1.5"/>
        <rect x="12" y="14" width="28" height="28" rx="6" fill="#155E75"/>
        <text x="21" y="33" font-family="monospace" font-size="14" font-weight="bold" fill="#67E8F9">03</text>
        <text x="50" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Container Stdout</text>
        <text x="50" y="42" font-family="sans-serif" font-size="10" fill="#9CA3AF">SRE Standard JSON</text>

        <rect x="12" y="58" width="156" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Trace ID Tracking</text>
        <text x="20" y="94" font-family="monospace" font-size="10" fill="#67E8F9">tr_89ab34cd-1234</text>

        <rect x="12" y="120" width="156" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="138" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">ISO Timestamps</text>
        <text x="20" y="156" font-family="sans-serif" font-size="10" fill="#9CA3AF">Single-line stdout stream</text>
      </g>

      <!-- Pillar 4: Colocated Backend Logs -->
      <g transform="translate(632, 90)">
        <rect width="196" height="190" rx="8" fill="#312E81" stroke="#818cf8" stroke-width="1.5"/>
        <rect x="12" y="14" width="28" height="28" rx="6" fill="#3730A3"/>
        <text x="21" y="33" font-family="monospace" font-size="14" font-weight="bold" fill="#A5B4FC">04</text>
        <text x="50" y="27" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Isolated Logs/</text>
        <text x="50" y="42" font-family="sans-serif" font-size="10" fill="#9CA3AF">Colocated & Rotated</text>

        <rect x="12" y="58" width="172" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="76" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">5MB Log Rotation</text>
        <text x="20" y="94" font-family="sans-serif" font-size="10" fill="#9CA3AF">Rotating disk buffer</text>

        <rect x="12" y="120" width="172" height="52" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="138" font-family="sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Isolated .gitignore</text>
        <text x="20" y="156" font-family="sans-serif" font-size="10" fill="#9CA3AF">Zero repo log coupling</text>
      </g>

      <!-- Connector Arrows Down to Dev Dashboard -->
      <line x1="122" y1="280" x2="122" y2="330" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="322" y1="280" x2="322" y2="330" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
      <line x1="522" y1="280" x2="522" y2="330" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="730" y1="280" x2="730" y2="330" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Lower Box: Telemetry HUD & RFC 7807 Error Boundaries -->
      <g transform="translate(32, 335)">
        <rect width="796" height="110" rx="8" fill="rgba(17,24,39,0.95)" stroke="#6366f1" stroke-width="1.5"/>
        <text x="24" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">Developer Dashboard Telemetry Engine & RFC 7807 Incident Ledger</text>
        <text x="24" y="52" font-family="sans-serif" font-size="11" fill="#9CA3AF">Real-time SSE event stream `/api/telemetry/stream` aggregates all 4 pillars with zero cross-app data leakage.</text>
        
        <rect x="24" y="66" width="230" height="30" rx="4" fill="#1E1B4B" stroke="#6366f1" stroke-width="1"/>
        <text x="36" y="86" font-family="monospace" font-size="11" fill="#818CF8">🛡️ RFC 7807 Problem JSON</text>

        <rect x="270" y="66" width="240" height="30" rx="4" fill="#064E3B" stroke="#10b981" stroke-width="1"/>
        <text x="282" y="86" font-family="monospace" font-size="11" fill="#34D399">⚡ Live SSE Latency Stream</text>

        <rect x="526" y="66" width="270" height="30" rx="4" fill="#164E63" stroke="#06b6d4" stroke-width="1"/>
        <text x="538" y="86" font-family="monospace" font-size="11" fill="#67E8F9">🔒 PII Redaction at Ingress</text>
      </g>
    </svg>
  </div>
</body>
</html>
