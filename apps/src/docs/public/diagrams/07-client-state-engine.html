<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero-FOUC Client State &amp; Storage Hydration</title>
  <style>
    :root {
      --bg-root: #0b0f19;
      --bg-surface: #111827;
      --primary: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background: var(--bg-root); color: var(--text); font-family: var(--font); margin: 0; padding: 24px; display: flex; justify-content: center; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-root: #f8fafc;
        --bg-surface: #ffffff;
        --primary: #059669;
        --accent: #06b6d4;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
      }
      .card {
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      }
      svg rect[fill="#111827"] { fill: #ffffff !important; stroke: #e2e8f0; }
      svg rect[stroke="rgba(255,255,255,0.1)"], svg rect[stroke="rgba(255,255,255,0.08)"] { stroke: #e2e8f0 !important; }
      svg text[fill="#F3F4F6"] { fill: #0f172a !important; }
      svg text[fill="#9CA3AF"] { fill: #475569 !important; }
      svg rect[fill="#1E1B4B"] { fill: #eef2ff !important; stroke: #818cf8 !important; }
      svg rect[fill="#064E3B"] { fill: #ecfdf5 !important; stroke: #10b981 !important; }
      svg rect[fill="#164E63"] { fill: #f0fdfa !important; stroke: #06b6d4 !important; }
      svg rect[fill="#312E81"] { fill: #e0e7ff !important; stroke: #818cf8 !important; }
      svg text[fill="#818CF8"], svg text[fill="#A5B4FC"] { fill: #4338ca !important; }
      svg text[fill="#34D399"] { fill: #047857 !important; }
      svg text[fill="#67E8F9"] { fill: #0e7490 !important; }
      svg text[fill="#FBBF24"], svg text[fill="#F59E0B"] { fill: #b45309 !important; }
      svg text[fill="#EF4444"] { fill: #dc2626 !important; }
      svg rect[fill="rgba(17,24,39,0.95)"] { fill: #ffffff !important; stroke: #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-07 desc-07">
      <title id="title-07">Zero-FOUC Client State Engine Flow</title>
      <desc id="desc-07">Flow diagram detailing synchronous head script restoration, versioned localStorage persistence, and URL parameter two-way synchronization.</desc>
      
      <!-- Stage 1: Synchronous Head Script -->
      <rect x="50" y="50" width="200" height="90" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="150" y="80" text-anchor="middle" fill="#818CF8" font-size="13" font-weight="700">1. SYNCHRONOUS HEAD</text>
      <text x="150" y="100" text-anchor="middle" fill="#F3F4F6" font-size="11">getAstryxHeadStateScript()</text>
      <text x="150" y="120" text-anchor="middle" fill="#10B981" font-size="10">Zero-FOUC Theme &amp; Nav</text>
      
      <path d="M250 95 H320" stroke="#6366F1" stroke-width="2"/>
      <polygon points="315,91 323,95 315,99" fill="#6366F1"/>
      
      <!-- Stage 2: Versioned Store -->
      <rect x="320" y="50" width="200" height="90" rx="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="420" y="80" text-anchor="middle" fill="#67E8F9" font-size="13" font-weight="700">2. VERSIONED STORE</text>
      <text x="420" y="100" text-anchor="middle" fill="#F3F4F6" font-size="11">createStateStore(key, opts)</text>
      <text x="420" y="120" text-anchor="middle" fill="#9CA3AF" font-size="10">Automated Schema Migrations</text>
      
      <path d="M520 95 H590" stroke="#06B6D4" stroke-width="2"/>
      <polygon points="585,91 593,95 585,99" fill="#06B6D4"/>
      
      <!-- Stage 3: Reactive URL Sync -->
      <rect x="590" y="50" width="160" height="90" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
      <text x="670" y="80" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700">3. URL SYNC</text>
      <text x="670" y="100" text-anchor="middle" fill="#F3F4F6" font-size="11">createUrlState()</text>
      <text x="670" y="120" text-anchor="middle" fill="#F3F4F6" font-size="10">history.replaceState</text>
      
      <!-- Bottom Summary Box -->
      <rect x="50" y="190" width="700" height="160" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="80" y="225" fill="#F3F4F6" font-size="14" font-weight="700">Client State Guarantees (Enterprise Standard):</text>
      <text x="80" y="255" fill="#9CA3AF" font-size="12">• Namespaced keys: sg_forge:app:state:v1 to prevent cross-app collision</text>
      <text x="80" y="280" fill="#9CA3AF" font-size="12">• Automatic error recovery: JSON parse failure gracefully falls back to default value</text>
      <text x="80" y="305" fill="#9CA3AF" font-size="12">• Cross-tab synchronization via BroadcastChannel or storage event subscribers</text>
      <text x="80" y="330" fill="#10B981" font-size="12">• 100% verified across Tier 1 Unit and Tier 2 Integration test suites</text>
    </svg>
  </div>
</body>
</html>
