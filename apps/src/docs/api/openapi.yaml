openapi: 3.1.0
info:
  title: SG Forge Enterprise Gateway API
  description: Core microservice platform API endpoints and dual-probe healthcheck contracts.
  version: 2.0.0
servers:
  - url: http://localhost
    description: Local development gateway
tags:
  - name: Health
    description: Service healthcheck probes
  - name: Auth
    description: Identity, authentication and organizational hierarchy APIs
paths:
  /health:
    get:
      operationId: getHealthStatus
      tags:
        - Health
      summary: Dual-probe liveness and readiness healthcheck
      description: Returns service status, port allocation, and uptime metrics.
      responses:
        '200':
          description: Operational health status
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - port
                  - uptime
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: portal
                  port:
                    type: integer
                    example: 3188
                  uptime:
                    type: number
                    example: 120.5
  /api/health:
    get:
      operationId: getApiHealthStatus
      tags:
        - Health
      summary: API healthcheck probe
      description: Returns operational status for API gateway.
      responses:
        '200':
          description: API Gateway operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/auth/hierarchy/{id}/is-manager:
    get:
      operationId: checkEmployeeIsManager
      tags:
        - Auth
      summary: Check if employee is a manager by hierarchy
      description: Returns boolean isManager based on whether employee has at least one subordinate child in the corporate hierarchy.
      parameters:
        - name: id
          in: path
          required: true
          description: Employee user ID, email address, or 'me'
          schema:
            type: string
            example: usr-bob-lead
      responses:
        '200':
          description: Manager detection result
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - userId
                  - isManager
                  - directReportsCount
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  userId:
                    type: string
                    example: usr-bob-lead
                  isManager:
                    type: boolean
                    example: true
                  directReportsCount:
                    type: integer
                    example: 3
        '401':
          description: Unauthorized when calling /me without valid session
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                properties:
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
        '404':
          description: Employee not found in organizational hierarchy
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                properties:
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string

