apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-proxy
  labels:
    app.kubernetes.io/name: forge-proxy
    app.kubernetes.io/part-of: ag-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-proxy
    spec:
      containers:
        - name: proxy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          resources:
            limits:
              memory: 128Mi
              cpu: 250m
            requests:
              memory: 64Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: forge-gateway-service
  labels:
    app.kubernetes.io/name: forge-gateway-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
  selector:
    app.kubernetes.io/name: forge-proxy
