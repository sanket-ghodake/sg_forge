apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-dev-hub
  labels:
    app.kubernetes.io/name: forge-dev-hub
    app.kubernetes.io/part-of: ag-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-dev-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-dev-hub
    spec:
      containers:
        - name: dev-hub
          image: ag-dashboard/dev-hub:latest
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 3003
              name: http
          resources:
            limits:
              memory: 128Mi
              cpu: 250m
            requests:
              memory: 32Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: forge-dev-hub-service
  labels:
    app.kubernetes.io/name: forge-dev-hub-service
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: 3003
      name: http
  selector:
    app.kubernetes.io/name: forge-dev-hub
