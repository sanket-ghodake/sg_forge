apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-dev-hub
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-dev-hub
    app.kubernetes.io/part-of: ag-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-dev-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-dev-hub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dev-hub
          image: ag-dashboard/dev-hub:v2.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 3003
              name: http
          resources:
            limits:
              memory: 128Mi
              cpu: 250m
            requests:
              memory: 32Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forge-dev-hub-service
  labels:
    app.kubernetes.io/name: forge-dev-hub-service
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: 3003
      name: http
  selector:
    app.kubernetes.io/name: forge-dev-hub
