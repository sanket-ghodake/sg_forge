apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-portal
  labels:
    app.kubernetes.io/name: forge-portal
    app.kubernetes.io/part-of: ag-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ag-dashboard/portal:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 3001
              name: http
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
            requests:
              memory: 32Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: portal-db-storage
              mountPath: /app/data
      volumes:
        - name: portal-db-storage
          persistentVolumeClaim:
            claimName: forge-portal-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: forge-portal-service
  labels:
    app.kubernetes.io/name: forge-portal-service
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app.kubernetes.io/name: forge-portal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-portal-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
