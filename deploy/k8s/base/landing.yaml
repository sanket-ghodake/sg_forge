apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-landing
  labels:
    app.kubernetes.io/name: forge-landing
    app.kubernetes.io/part-of: ag-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-landing
    spec:
      containers:
        - name: landing
          image: ag-dashboard/landing:latest
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 3000
              name: http
          resources:
            limits:
              memory: 128Mi
              cpu: 250m
            requests:
              memory: 32Mi
              cpu: 50m
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: forge-landing-service
  labels:
    app.kubernetes.io/name: forge-landing-service
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: forge-landing
